name: Deploy to Local Cluster

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: arc-runner-set
    steps:
      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Pipeline Configuration
        id: config
        run: |
          pwd
          echo "argocd_application_name=$(yq '.argocd.application.name'config.yaml)" >> "$GITHUB_OUTPUT"
          echo ${{ github.repository }}

      # - name: setup kubectl
      #   uses: azure/setup-kubectl@v4

      # - name: Get Kubeconfig
      #   id: kubeconfig
      #   run: |
      #     kubectl config get-contexts

      - name: Setup Argocd CLI
        run: |
          VERSION=$(curl -L -s https://raw.githubusercontent.com/argoproj/argo-cd/stable/VERSION)
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/download/v$VERSION/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64
        
      - name: Login to ArgoCD
        run: |
          argocd login  argocd-server.argocd.svc.cluster.local:80 \
          --username admin \
          --password 'admin' \
          --insecure \
          --grpc-web \
          --grpc-web-root-path /argocd \
          --plaintext
      
      - name: Create ArgoCD Application
        run: |
          argocd app create ${{ steps.config.outputs.argocd_application_name }} \
            --repo ${{ github.repository }} \
            --path sample-app-gitops/charts \
            --dest-server https://kubernetes.default.svc \
            --dest-namespace argocd \
            --sync-policy automated \
            --self-heal \
            --auto-prune \
            --revision main
