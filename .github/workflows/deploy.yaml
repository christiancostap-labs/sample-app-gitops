name: Deploy to Local Cluster

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: arc-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Get Kubeconfig
        id: kubeconfig
        run: |
          kubectl config get-contexts
